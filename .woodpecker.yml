# Codeberg / Woodpecker: the three ways this thing can actually be broken -- JavaScript the browser
# refuses to run, a config template that renders into something nginx will not accept (an unquoted
# brace, a ${VAR} the image's ENV forgot to define, an envsubst that swallows nginx's own
# $variables), and a page that has drifted from what the real route accepts. There is nothing to
# compile: the tree is static files, one nginx template and a Dockerfile that copies them.
#
# The template step runs in the image the product is: nginx:alpine's own nginx.conf includes
# /etc/nginx/conf.d/*.conf inside its http context, which is where the container's entrypoint puts
# the rendered template -- the plain alpine package's nginx.conf includes conf.d in the *main*
# context instead, so a check there rejects a perfectly good server block. gettext's envsubst comes
# from the image too; the official nginx image ships it for its own entrypoint. The `map` the config
# needs is generated by the same entrypoint script CI is asked to run, so `nginx -t` sees exactly
# what the container sees -- without it the config would fail on an unknown variable.
#
# The third check is the mock's: dev/mock-upstream.py refuses requests in radiance's exact words, and
# `--selftest` compares that wording field by field. It is the only thing standing between this page
# and a route no runner here can reach, so its rules are tested instead of trusted.
#
# The image itself is published from a workstation by scripts/publish.sh, not here, because the
# registry is ghcr.io and the credential is a personal packages token; this runner is not asked to
# hold one. What CI does check is the file you paste into Komodo -- scripts/check-stack.sh, the same
# one a workstation runs before publishing.
#
# `$$` escapes Woodpecker's substitution, which runs on the raw command text and ignores quotes:
# unescaped, $f in the loops below and $request_uri in the grep would arrive empty, and an empty
# expansion fails nothing.
when:
  - event: [push, pull_request, tag]

steps:
  check:
    image: alpine:3.21
    commands:
      - apk add --no-cache nodejs python3
      # The page's modules and the dev tools that drive it. All ES modules; a syntax error in any of
      # them is invisible until a browser is pointed at the page.
      - for f in public/*.js dev/*.mjs; do node --input-type=module --check < "$$f"; done
      - for f in scripts/*.sh dev/run.sh docker/*.sh; do sh -n "$$f"; done
      - node dev/check-page.mjs
      - python3 dev/mock-upstream.py --selftest

  template:
    image: docker.io/nginx:alpine
    commands:
      # Render the way the container does -- with the image's own defaults, which is the case a Komodo
      # stack that sets nothing actually hits -- so an ENV line that was forgotten shows up here as an
      # empty directive rather than as a container that starts and answers nothing. GIT_SHA is a build
      # argument, so the tree has no value for it here; VERSION is what the footer prints, and a build
      # without one is exactly what is being rendered. The second sed keeps only VAR=value lines, since
      # busybox sed ends a `/^ENV /,/[^\]$/` range a line later than GNU does and would otherwise hand
      # HEALTHCHECK and CMD to eval.
      - export GIT_SHA=
      - eval "$$(sed -n '/^ENV /,/[^\\]$$/p' Dockerfile | tr -d '\\'
          | sed -n 's/^ENV //; s/^ *//; s/^\([A-Z_][A-Z_0-9]*\)=.*/export &/p')"
      # The allow-list the config's `map` is built from, by the script the image's entrypoint runs.
      # Without that file the rendered config would not even parse: `set $$upstream
      # $$upstream_from_header` names a variable only the map defines.
      - UPSTREAM_OPTIONS='[{"label":"another swap","url":"http://127.0.0.1:9000"}]'
          sh docker/10-upstream-map.sh
      - grep -qF 'map $$http_x_upstream $$upstream_from_header' /etc/nginx/conf.d/10-upstream-map.conf
      - grep -qF '"~^(?:http://127\.0\.0\.1:9000)$"' /etc/nginx/conf.d/10-upstream-map.conf
      # And the default, where nothing is listed: an empty map, so the header can reach no host at all.
      - mkdir -p /tmp/none && CONF_DIR=/tmp/none UPSTREAM_OPTIONS='' sh docker/10-upstream-map.sh
      - test "$$(grep -c '"~' /tmp/none/10-upstream-map.conf || true)" = 0
      # The list is the whole substitutable surface, and it has to reach envsubst as names, not as the
      # values the shell would expand them to -- hence the single quotes, and the `$` doubled past
      # Woodpecker. A bare `envsubst` would also replace nginx's own $variables -- $upstream,
      # $request_uri -- which is how a config that renders can still be wrong.
      - envsubst '$${PORT} $${UPSTREAM_URL} $${UPSTREAM_API_KEY} $${MODEL} $${APP_TITLE}
          $${STREAM_DEFAULT} $${MAX_DURATION} $${DEFAULT_DURATION} $${REQ_TIMEOUT} $${RESOLVER}
          $${UPSTREAM_OPTIONS} $${VERSION}'
          < nginx/default.conf.template > /etc/nginx/conf.d/default.conf
      - grep -qF 'proxy_pass $$upstream$$request_uri' /etc/nginx/conf.d/default.conf
      - grep -qF 'set $$upstream $$upstream_from_header' /etc/nginx/conf.d/default.conf
      - grep -q 'listen 8090 default_server' /etc/nginx/conf.d/default.conf
      # /config.json is the whole surface the page reads; a field that failed to render is a page that
      # silently starts from the wrong defaults.
      - grep -q '"upstreamOptions":\[\]' /etc/nginx/conf.d/default.conf
      - grep -q '"title":"radiance studio"' /etc/nginx/conf.d/default.conf
      - grep -q '"maxDuration":"360"' /etc/nginx/conf.d/default.conf
      - grep -q '"stream":"true"' /etc/nginx/conf.d/default.conf
      - grep -q '"requestTimeout":"1800"' /etc/nginx/conf.d/default.conf
      - nginx -t

  stack:
    image: alpine:3.21
    commands:
      - apk add --no-cache git
      - sh scripts/check-stack.sh
